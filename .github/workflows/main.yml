
name: Revisar proyecto KORG M1 T3

on:
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Revisar archivos del proyecto
        run: |
          echo "Buscando archivos ZIP..."
          find . -type f -iname "*.zip"
          ZIP=$(find . -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No se encontró ningún ZIP"
            exit 1
          fi
          echo "Contenido del archivo: $ZIP"
          unzip -l "$ZIP" | head -n 100
