
name: Revisar proyecto KORG M1 T3

on:
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Examinar motor de audio
        run: |
          ZIP="KorgM1Android_0.3.0_motor_audio_fuente.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No se encontró el motor"
            exit 1
          fi
          echo "Contenido del motor:"
          unzip -l "$ZIP"
          
